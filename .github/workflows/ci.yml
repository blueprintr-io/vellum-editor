name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:public
      - run: npm run check:artifacts
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1
      - run: npm audit --audit-level=low
      - run: node scripts/check-glib-backport.mjs
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - run: cargo test --release --locked --manifest-path src-tauri/security-tests/Cargo.toml
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file src-tauri/Cargo.lock --deny unsound
